    CONTRACT_PATHS: ""
  trigger:
    include: services/recommendation/.gitlab-ci.yml
  rules:
    - exists: [services/recommendation/.gitlab-ci.yml]
      changes: [services/recommendation/**/*, ci/**/*]

audio_transmitter:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: ""
  trigger:
    include: services/audio_transmitter/.gitlab-ci.yml
  rules:
