openapi: 3.1.0
info:
  title: SyncWave Catalogue Service
  version: 0.1.0
  description: |
    Canonical source for song metadata and lyrics/waveform processing state.
    Songs enter the catalogue when Upload publishes `SongUploaded`; Lyrics and
    Waveform then report processing results, and Catalogue derives each song's
    overall readiness and publishes `SongReady` when a song becomes fully
    processable.
servers:
  - url: http://catalogue:8080
    description: Inside Docker Compose (the gateway adds the /api/catalogue prefix)
paths:
  /health:
    get:
      security: []
      summary: Health check
      operationId: catalogueHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /songs/{song_id}:
    get:
      security: []
      summary: Get one song by ID
      operationId: catalogueGetSong
      parameters:
        - in: path
          name: song_id
          required: true
          schema:
            type: string
            format: uuid
          description: Canonical song ID (UUID v4).
      responses:
        "200":
          description: The song record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        "400":
          description: song_id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "404":
          description: No song with this ID exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /songs:
    get:
      security: []
      summary: List songs
      operationId: catalogueListSongs
      description: |
        Returns a page of songs ordered by creation (newest first). Use
        `limit` (default 20, max 100) and `next_cursor` from a previous
        response to page. Set `processing_status` to READY to discover songs
        that are fully processable (recommendation/search flows).
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size.
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque paging token from a previous response's `next_cursor`.
        - in: query
          name: processing_status
          schema:
            type: string
            enum: [PROCESSING, PARTIAL, READY, FAILED]
          description: Only return songs in this processing state.
      responses:
        "200":
          description: A page of songs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongList'
        "400":
          description: Invalid cursor or processing_status value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    Song:
      type: object
      required: [song_id, title, artist, audio_reference, lyrics_status, waveform_status, processing_status, created_at, updated_at]
      properties:
        song_id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        mood:
          type: [string, "null"]
          description: Optional mood label for the song.
        duration_ms:
          type: [integer, "null"]
          minimum: 0
          description: Audio duration in milliseconds. null until Waveform has measured it.
        audio_reference:
          type: string
          description: S3 object key of the uploaded audio, e.g. "audio/<song_id>.mp3".
        lyrics_status:
          type: string
          enum: [PENDING, PROCESSING, READY, FAILED]
        waveform_status:
          type: string
          enum: [PENDING, PROCESSING, READY, FAILED]
        processing_status:
          type: string
          enum: [PROCESSING, PARTIAL, READY, FAILED]
          description: Derived from the two stage statuses. READY when both are READY.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SongList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Song'
        next_cursor:
          type: [string, "null"]
          description: Opaque paging token; null when there are no more pages.
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: SONG_NOT_FOUND
        message:
          type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
