name: audio-testing-audio-sampler

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audio_transmitter}
      POSTGRES_USER: ${POSTGRES_USER:-audio_transmitter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audio_transmitter_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - audio_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  audio_transmitter:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-audio_transmitter}:${POSTGRES_PASSWORD:-audio_transmitter_dev_password}@db:5432/${POSTGRES_DB:-audio_transmitter}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/cache"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: audio_testing_test
      POSTGRES_USER: audio_testing_test
      POSTGRES_PASSWORD: audio_testing_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-audio:
    build:
      context: .
      target: builder
    profiles: ["test"]
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://audio_testing_test:audio_testing_test@test-db:5432/audio_testing_test
    volumes:
      - audio_cargo_target:/app/target
    command: ["cargo", "test", "--locked"]

volumes:
  audio_db_data:
  audio_cargo_target:
