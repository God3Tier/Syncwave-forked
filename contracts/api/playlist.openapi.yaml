openapi: 3.1.0
info:
  title: SyncWave Playlist Service
  version: 1.0.0
  description: |
    User playlists: an ordered list of songs. The Playlist Service stores only
    `song_id`s and their order; titles, artists, durations and audio belong to
    the Catalogue and Streaming services. The browser resolves a `song_id` to
    metadata through the Catalogue and to audio through the Streaming Service.

    Browsers call it through the gateway, e.g.
    `GET http://localhost:8080/api/playlist/playlists/{playlist_id}`. The paths
    below are the service's own paths, without the `/api/playlist` prefix.

    Ordering rules:
    - `position` is 0-based and contiguous (0, 1, 2, ...).
    - A song appears at most once per playlist.
    - The order is **persisted**. Reading a playlist twice returns the same
      order, and shuffling saves the new order, so the browser's prefetch
      window (plan.md section 5) stays stable until the order is changed.
    - A `song_id` is checked against the Catalogue when added: a song the
      Catalogue does not have is refused (`SONG_NOT_FOUND`), and so is any add
      while the Catalogue cannot be reached (`CATALOGUE_UNAVAILABLE`). Nothing
      is stored in either case. Songs removed from the Catalogue later are not
      detected. Every other operation works without the Catalogue.
servers:
  - url: http://playlist:8080
    description: Inside Docker Compose (the gateway adds the /api/playlist prefix)
security: []
tags:
  - name: playlists
    description: Playlist create, read, update and delete
  - name: songs
    description: Songs inside a playlist, their order and shuffle
  - name: operations
    description: Health checks
paths:
  /health:
    get:
      tags: [operations]
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /playlists:
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create a playlist
      description: |
        `playlist_id` is generated by the Playlist Service. `owner_id` is the
        browser-generated `user_id` (see `contracts/README.md`); there is no
        authentication in scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylistRequest"
            example:
              owner_id: 5d1f3a7e-2b94-4c60-8e15-a7c3f9b2d041
              name: Rainy day
      responses:
        "201":
          description: The playlist was created, initially empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: "Invalid body (`INVALID_REQUEST`), e.g. a blank name or an `owner_id` that is not a UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [playlists]
      operationId: listPlaylists
      summary: List a user's playlists
      description: Returns playlist summaries (no songs), newest first.
      parameters:
        - name: owner_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of playlist summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistPage"
        "400":
          description: "Missing or invalid `owner_id`, `limit` or `cursor` (`INVALID_REQUEST`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /playlists/{playlist_id}:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: Get a playlist with its songs in order
      responses:
        "200":
          description: The playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
              example:
                playlist_id: 9a4c1e6b-3f27-4d80-b5a1-6e2d8c7f0a13
                owner_id: 5d1f3a7e-2b94-4c60-8e15-a7c3f9b2d041
                name: Rainy day
                songs:
                  - song_id: 0b6c2f4e-8d3a-4f7b-b1e2-9c5d7a3e1f20
                    position: 0
                  - song_id: 7e91d5a2-60c4-4b38-9f0e-2a4b6c8d1e35
                    position: 1
                song_count: 2
                created_at: "2026-10-08T12:00:00.000Z"
                updated_at: "2026-10-08T12:05:30.120Z"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
    patch:
      tags: [playlists]
      operationId: renamePlaylist
      summary: Rename a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePlaylistRequest"
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: "Invalid id or body (`INVALID_REQUEST`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Delete a playlist
      responses:
        "204":
          description: The playlist and its song list were deleted.
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
  /playlists/{playlist_id}/songs:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    post:
      tags: [songs]
      operationId: addSong
      summary: Add a song to a playlist
      description: |
        Without `position` the song is appended. With `position` it is inserted
        there and later songs move down by one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSongRequest"
            example:
              song_id: 0b6c2f4e-8d3a-4f7b-b1e2-9c5d7a3e1f20
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: "Invalid id or body, or `position` is larger than the song count (`INVALID_REQUEST`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The playlist (`PLAYLIST_NOT_FOUND`) or the song in the Catalogue (`SONG_NOT_FOUND`) does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The song is already in the playlist (`SONG_ALREADY_IN_PLAYLIST`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "The Catalogue could not be asked, so the song was not added (`CATALOGUE_UNAVAILABLE`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [songs]
      operationId: reorderSongs
      summary: Replace the song order
      description: |
        `song_ids` must contain exactly the songs currently in the playlist,
        each once, in the new order. Anything else is rejected, so a reorder
        can neither add nor drop songs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderSongsRequest"
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: "`song_ids` does not match the playlist's songs (`INVALID_REQUEST`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
  /playlists/{playlist_id}/songs/{song_id}:
    delete:
      tags: [songs]
      operationId: removeSong
      summary: Remove a song from a playlist
      description: Later songs move up by one so positions stay contiguous.
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
        - name: song_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          description: "The playlist (`PLAYLIST_NOT_FOUND`) or the song in it (`SONG_NOT_IN_PLAYLIST`) does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /playlists/{playlist_id}/shuffle:
    post:
      tags: [songs]
      operationId: shufflePlaylist
      summary: Shuffle a playlist
      description: |
        Picks a new random order and **saves it**. The response is the playlist
        in the new order, so every later read returns the same order.
      parameters:
        - $ref: "#/components/parameters/PlaylistId"
      responses:
        "200":
          description: The playlist in its new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
components:
  parameters:
    PlaylistId:
      name: playlist_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidId:
      description: "An id in the path is not a UUID (`INVALID_REQUEST`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PlaylistNotFound:
      description: "No playlist with this id (`PLAYLIST_NOT_FOUND`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    CreatePlaylistRequest:
      type: object
      required: [owner_id, name]
      properties:
        owner_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
    RenamePlaylistRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    AddSongRequest:
      type: object
      required: [song_id]
      properties:
        song_id:
          type: string
          format: uuid
        position:
          description: 0-based insert position. Omit to append.
          type: integer
          minimum: 0
    ReorderSongsRequest:
      type: object
      required: [song_ids]
      properties:
        song_ids:
          type: array
          items:
            type: string
            format: uuid
    Playlist:
      type: object
      required: [playlist_id, owner_id, name, songs, song_count, created_at, updated_at]
      properties:
        playlist_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        songs:
          description: Sorted by `position`.
          type: array
          items:
            $ref: "#/components/schemas/PlaylistSong"
        song_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlaylistSong:
      type: object
      required: [song_id, position]
      properties:
        song_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
    PlaylistSummary:
      type: object
      required: [playlist_id, owner_id, name, song_count, created_at, updated_at]
      properties:
        playlist_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        song_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlaylistPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistSummary"
        next_cursor:
          description: Pass as `cursor` for the next page. `null` on the last page.
          type: [string, "null"]
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [PLAYLIST_NOT_FOUND]
        message:
          type: string
