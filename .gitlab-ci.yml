      changes: [services/audio_transmitter/**/*, ci/**/*]

song_request_orchestrator:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: ""
  trigger:
    include: services/song_request_orchestrator/.gitlab-ci.yml
  rules:
