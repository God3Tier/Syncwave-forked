# Child pipeline for the Streaming Service (see ci/service.yml). The root
# .gitlab-ci.yml starts it when this folder or ci/ changes.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - when: never

include:
  - local: ci/service.yml

variables:
  SERVICE: audio_transmitter   # = folder name = image name; the ECS service is "streaming"
  SERVICE_DIR: services/audio_transmitter

test:audio-sampler:
  stage: test
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache make bash
    - cd services/audio_transmitter
  script:
    - bash -o pipefail -c 'make test 2>&1 | tee audio-test.log'
  after_script:
    - docker compose -f services/audio_transmitter/compose.yaml --profile test ps --all > services/audio_transmitter/compose-ps.txt 2>&1 || true
    - docker compose -f services/audio_transmitter/compose.yaml --profile test logs --no-color --timestamps > services/audio_transmitter/compose-logs.txt 2>&1 || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - services/audio_transmitter/audio-test.log
      - services/audio_transmitter/compose-ps.txt
      - services/audio_transmitter/compose-logs.txt

build:
  extends: .build-image

deploy:
  extends: .deploy-ecs
  variables:
    ECS_SERVICES: streaming   # the name Sync and the ALB use; target groups allow no underscores
