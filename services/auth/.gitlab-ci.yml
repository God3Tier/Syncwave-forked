include:
  - local: ci/service.yml

variables:
  SERVICE: auth
  SERVICE_DIR: services/auth

lint:
  extends: .lint
  image: python:3.12-slim
  script:
    - pip install --quiet -r requirements-dev.txt
    - ruff check src tests migrations
    - ruff format --check src tests migrations

test:
  extends: .test
  image: python:3.12-slim
  variables:
    TEST_REPORTS: report.xml
  script:
    - pip install --quiet -r requirements-dev.txt
    - pytest --junitxml=report.xml

build:
  extends: .build-image

deploy:
  # Deploys to ECS on main, like every other service. The ECR repository and
  # the ECS service come from infrastructure/aws/services/auth.
  extends: .deploy-ecs
