include:
  - local: ci/service.yml

variables:
  SERVICE: auth
  SERVICE_DIR: services/auth

lint:
  extends: .lint
  image: python:3.12-slim
  script:
    - pip install --quiet -r requirements-dev.txt
    - ruff check src tests migrations
    - ruff format --check src tests migrations

test:
  extends: .test
  image: python:3.12-slim
  variables:
    TEST_REPORTS: report.xml
  script:
    - pip install --quiet -r requirements-dev.txt
    - pytest --junitxml=report.xml

build:
  extends: .build-image

deploy:
  extends: .deploy-ecs
  # Auth does not yet have an infrastructure/aws/services/auth stack. Running
  # the generic deploy before that stack exists fails while copying to the
  # absent syncwave/auth ECR repository (and would next lack an ECS task
  # definition). Enable this only after Terraform has provisioned both.
  rules:
    - if: $PARENT_SOURCE != "merge_request_event" && $CI_COMMIT_REF_NAME == "main" && $AWS_ROLE_ARN && $AUTH_AWS_READY == "true"
