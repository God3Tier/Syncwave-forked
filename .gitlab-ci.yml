      changes: [services/song_request_orchestrator/**/*, ci/**/*]

jam:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/websocket contracts/grpc contracts/api/catalogue.openapi.yaml
  trigger:
    include: services/jam/.gitlab-ci.yml
  rules:
    - exists: [services/jam/.gitlab-ci.yml]
      changes: [services/jam/**/*, contracts/websocket/**/*, contracts/grpc/**/*, contracts/api/catalogue.openapi.yaml, tests/integration/backend-flow.py, tests/integration/jam-expiry.py, ci/**/*]

sync:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/websocket contracts/grpc
  trigger:
    include: services/sync/.gitlab-ci.yml
  rules:
    - exists: [services/sync/.gitlab-ci.yml]
      changes: [.gitlab-ci.yml, services/sync/**/*, contracts/websocket/**/*, contracts/grpc/**/*, tests/integration/backend-flow.py, ci/**/*]

frontend:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/websocket
  trigger:
    include: frontend/.gitlab-ci.yml
  rules:
    - exists: [frontend/.gitlab-ci.yml]
      changes: [frontend/**/*, contracts/websocket/**/*, tests/e2e/**/*, ci/**/*]

# ── integration: staging = full stack in CI ─────────────────────────────────
# Starts docker-compose.yml with the images tagged :staging (no rebuild),
# waits for every healthcheck, then runs the smoke test and, once they
# exist, the end-to-end tests for the three scenarios.

integration:
  stage: integration
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_REGISTRY: $CI_REGISTRY_IMAGE
    IMAGE_TAG: staging
  script:
    # Host-side fault runner uses only Python's standard library and Docker CLI.
    - apk add --no-cache python3
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Real Catalogue/media/consumers; fixed weather keeps mood checks deterministic.
    - docker compose -f docker-compose.yml -f tests/integration/ingestion.compose.yaml up --detach --no-build --pull always --quiet-pull --wait --wait-timeout 300
    - sh tests/integration/smoke.sh docker
    # Item 2: upload, Search, duplicate delivery, mood ranking and processing recovery.
    - docker compose cp tests/integration/upload-flow.py upload:/tmp/upload-flow.py
    - docker compose cp tests/integration/ingestion-flow.py upload:/tmp/ingestion-flow.py
    - docker compose exec -T upload python /tmp/ingestion-flow.py --report /tmp/ingestion-flow-report.json
    # Item 4: generated uploads -> Playlist -> Jam -> two-client Sync scheduling.
    - docker compose cp tests/integration/upload-flow.py jam:/tmp/upload-flow.py
    - docker compose cp tests/integration/backend-flow.py jam:/tmp/backend-flow.py
    - docker compose exec -T jam python /tmp/backend-flow.py --check-reconnect --check-resync --report /tmp/backend-flow-report.json
    # Durable lifecycle: expire a backdated Jam while no room page is connected.
    - docker compose cp tests/integration/jam-expiry.py jam:/tmp/jam-expiry.py
    - docker compose exec -T jam python /tmp/jam-expiry.py --report /tmp/jam-expiry-report.json
    # Run disruptions sequentially after the happy paths; the runner restores services.
    - python3 tests/integration/failure-recovery.py --base-url http://docker:8080 --report tests/integration/failure-recovery-report.json
    - if [ -f tests/e2e/run.sh ]; then sh tests/e2e/run.sh docker; fi
  after_script:
    - docker compose cp upload:/tmp/ingestion-flow-report.json tests/integration/ingestion-flow-report.json || true
    - docker compose cp jam:/tmp/backend-flow-report.json tests/integration/backend-flow-report.json || true
    - docker compose cp jam:/tmp/jam-expiry-report.json tests/integration/jam-expiry-report.json || true
    - docker compose ps --all > compose-ps.txt 2>&1 || true
    - docker compose logs --no-color --timestamps > compose-logs.txt 2>&1 || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - compose-ps.txt
      - compose-logs.txt
      - tests/integration/ingestion-flow-report.json
      - tests/integration/backend-flow-report.json
      - tests/integration/jam-expiry-report.json
      - tests/integration/failure-recovery-report.json
      - tests/e2e/artifacts/
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == "staging"
