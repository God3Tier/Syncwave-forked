# Shared job templates for every service's child pipeline.
#
# services/<name>/.gitlab-ci.yml includes this file, sets SERVICE and
# SERVICE_DIR, and defines four jobs: lint, test, build and deploy, extending
# the hidden jobs below. The root pipeline passes in two variables:
#   PARENT_SOURCE   the parent's $CI_PIPELINE_SOURCE (child pipelines always
#                   report "parent_pipeline", so branch rules need this)
#   CONTRACT_PATHS  the contract folders this service's image is built against
# See services/_template/.gitlab-ci.yml for a complete example.
#
#   lint ─> test ─> build ─> scan (dev only) ─> deploy (main only)
#
# What runs where:
#   merge request   lint, test, build (the image is built here, once)
#   dev             lint, test, build (reused), container scan
#   staging         lint, test, build (reused); then the root pipeline's integration job
#   main            lint, test, build (reused), deploy to ECS

include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages:
  - lint
  - test
  - build
  - scan
  - deploy

default:
  interruptible: true   # a newer push cancels this pipeline (saves shared CI minutes)

.lint:
  stage: lint
  before_script:
    - cd "$SERVICE_DIR"

.test:
  stage: test
  variables:
    TEST_REPORTS: "**/TEST-*.xml"   # JUnit XML, relative to SERVICE_DIR
  before_script:
    - cd "$SERVICE_DIR"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: $SERVICE_DIR/$TEST_REPORTS

.build-image:
  stage: build
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - sh ci/scripts/build-image.sh
  artifacts:
    reports:
      dotenv: build.env   # passes IMAGE_TAG to the scan and deploy jobs
  rules:
    - if: $PARENT_SOURCE != "merge_request_event" && $CI_COMMIT_REF_NAME =~ /^(dev|staging|main)$/
      variables:
        PROMOTE_TAG: $CI_COMMIT_REF_NAME
    - when: on_success

# Overrides the job from GitLab's Container Scanning template (Trivy):
# scans the image this pipeline built or reused, on dev only. Findings
# appear in the pipeline's Security tab. The job does not fail the
# pipeline (allow_failure comes from the template).
container_scanning:
  stage: scan
  dependencies: [build]
  before_script:
    - export CS_IMAGE="$CI_REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG"
  rules:
    - if: $PARENT_SOURCE != "merge_request_event" && $CI_COMMIT_REF_NAME == "dev"

# Production deploy to Amazon ECS. Authenticates to AWS with a short-lived
# GitLab OIDC token, so no long-lived AWS keys are stored in GitLab.
# The job only appears once AWS_ROLE_ARN is configured
# (Settings > CI/CD > Variables, protected); see infrastructure/aws/README.md.
.deploy-ecs:
  stage: deploy
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  interruptible: false               # never cancel a deploy half-way
  resource_group: production-$SERVICE   # one deploy of this service at a time
  environment:
    name: production
  dependencies: [build]
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  script:
    - apk add --no-cache --quiet aws-cli jq
    - echo "$AWS_ID_TOKEN" > "$CI_BUILDS_DIR/aws-web-identity-token"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_BUILDS_DIR/aws-web-identity-token"
    - export AWS_ROLE_SESSION_NAME="gitlab-$CI_PROJECT_ID-$CI_PIPELINE_ID"
    - sh ci/scripts/deploy-ecs.sh
  rules:
    - if: $PARENT_SOURCE != "merge_request_event" && $CI_COMMIT_REF_NAME == "main" && $AWS_ROLE_ARN
