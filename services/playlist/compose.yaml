# Playlist Service (README.md), included from the root docker-compose.yml.
# The API behind the gateway at /api/playlist. It needs Postgres (no RabbitMQ,
# no S3). With CATALOGUE_MODE=http it also asks the Catalogue Service whenever a
# song is added, and does not wait for it to start: adds are refused until it is up.

services:
  playlist:
    build:
      context: .
      additional_contexts:
        contracts: ../../contracts
    # Locally the image is built as syncwave/playlist:local. The staging
    # integration job sets IMAGE_REGISTRY/IMAGE_TAG to run the CI-built image.
    image: ${IMAGE_REGISTRY:-syncwave}/playlist:${IMAGE_TAG:-local}
    environment:
      SERVICE_NAME: playlist
      PORT: "8080"
      LOG_LEVEL: INFO
      # Postgres: this service's own database (infrastructure/postgres/init.sql).
      # Separate variables, never a URL with the password inside: in production
      # the password is injected on its own from AWS Secrets Manager.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: playlist
      DB_USER: playlist
      DB_PASSWORD: playlist
      # `http` (default): each added song is checked with the Catalogue Service
      # (GET /songs/{id}). Set `off` to accept any song id without a Catalogue.
      CATALOGUE_MODE: ${CATALOGUE_MODE:-http}
      CATALOGUE_URL: http://catalogue:8080
      CATALOGUE_TIMEOUT_SECONDS: "3"
      # gRPC GetPlaylist for Jam and Sync (contracts/grpc/syncwave/playlist/v1).
      # Internal only: not routed by the gateway. Callers send this token in the
      # x-internal-token header. Local development value, never a real secret.
      GRPC_PORT: "50051"
      INTERNAL_SERVICE_TOKEN: local-playlist-internal-token
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    expose:
      - "50051"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
