# SyncWave gateway (local). Gives the browser one origin, so there are no CORS issues:
#
#   /                      -> frontend:8080
#   /api/<service>/<path>  -> <service>:8080/<path>   (prefix stripped; WebSockets supported)
#   /healthz               -> the gateway's own health check
#
# Upstreams are resolved per request through Docker's DNS, so the gateway
# starts even before every service exists. A missing or stopped service
# returns 502 instead of preventing nginx from starting.
# In production, Application Load Balancer path rules play the same role.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS

    client_max_body_size 200m;                # audio uploads

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /api/$svc;
    proxy_set_header X-Request-ID       $request_id;   # log it in every service to trace one request
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    set $svc "";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Streaming: send audio ranges straight through. No response buffering,
    # and the client's Range header is forwarded unchanged.
    location ~ ^/api/(streaming)(/.*)$ {
        set $svc  $1;
        set $rest $2;
        proxy_buffering off;
        proxy_pass http://$svc:8081$rest$is_args$args;
    }

    # Upload: stream the request body to the Upload Service instead of
    # spooling the whole file to the gateway's disk first.
    location ~ ^/api/(upload)(/.*)$ {
        set $svc  $1;
        set $rest $2;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://$svc:8080$rest$is_args$args;
    }

    # Every other service. Long read timeout so Jam/Sync WebSockets stay open.
    location ~ ^/api/(auth|catalogue|search|lyrics|waveform|playlist|recommendation|jam|sync)(/.*)$ {
        set $svc  $1;
        set $rest $2;
        proxy_read_timeout 1h;
        proxy_pass http://$svc:8080$rest$is_args$args;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"UNKNOWN_SERVICE","message":"No service is routed at this path"}}';
    }

    location / {
        set $frontend frontend;
        proxy_pass http://$frontend:8080;
    }
}
