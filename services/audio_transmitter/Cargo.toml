[package]
name = "audio_transmitter"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
async-trait = "0.1"
aws-config = "1"
aws-sdk-s3 = "1.152.0"
aws-smithy-types = "1.8.1"
bytes = "1.12.1"
dotenvy = "0.15"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
