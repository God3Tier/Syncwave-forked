# SyncWave parent pipeline.
#
# This file decides WHAT runs; it builds nothing itself.
#   validate      contract checks and deployed-service CI test coverage checks
#   test          GitLab SAST + secret detection over the whole repo (once, not per service)
#   services      one child pipeline per service, only when that service, one of
#                 its contracts, or the shared CI (ci/) changed
#   integration   staging only: the full stack in Docker Compose + smoke/e2e tests
#
# Each service's own jobs live in services/<name>/.gitlab-ci.yml (shared
# templates: ci/service.yml). A trigger job below stays dormant until that
# file exists, so services can be added one at a time.
#
# CI minutes are shared by every CS302 team: pipelines run only for merge
# requests and for pushes to dev/staging/main, never for plain branch pushes.
# Running a pipeline manually (Build > Pipelines > Run pipeline) runs every
# existing service, because `changes:` rules count as matched for manual runs.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(staging|main)$/
      variables:
        # Already analysed in the MR and on dev; don't spend minutes again.
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "web"
  auto_cancel:
    on_new_commit: interruptible

stages:
  - validate
  - test
  - services
  - integration

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  AST_ENABLE_MR_PIPELINES: "true"   # run SAST / secret detection in MR pipelines too

default:
  interruptible: true

# ── validate: shared contracts ──────────────────────────────────────────────

ci:test-coverage:
  stage: validate
  image: python:3.14-slim
  script:
    - pip install --quiet PyYAML==6.0.3
    - python ci/scripts/check-test-coverage.py --report tests/integration/ci-test-coverage-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/integration/ci-test-coverage-report.json
  rules:
    - changes: [.gitlab-ci.yml, docker-compose.yml, services/**/*, frontend/**/*, tests/**/*, ci/**/*]

contracts:proto:
  stage: validate
  image:
    name: bufbuild/buf:1.73.0
    entrypoint: [""]
  script:
    - sh ci/scripts/check-proto.sh
  rules:
    - changes: [contracts/grpc/**/*]

contracts:schemas:
  stage: validate
  image: node:24-alpine
  script:
    - npm install --no-save --no-audit --no-fund --silent ajv@8 ajv-formats@3
    - node ci/scripts/validate-schemas.mjs contracts
    - |
      if ls contracts/api/*.openapi.yaml >/dev/null 2>&1; then
        npx --yes @redocly/cli@2 lint contracts/api/*.openapi.yaml
      else
        echo "No OpenAPI files yet."
      fi
  rules:
    - changes: [contracts/events/**/*, contracts/websocket/**/*, contracts/api/**/*]

# ── services: one child pipeline each ───────────────────────────────────────
# CONTRACT_PATHS lists the contract folders/files a service builds against.
# Keep it in step with the contract globs in that service's `changes:` list.
# Both feed the image's content tag (ci/scripts/image-tag.sh).

.service-trigger:
  stage: services
  needs: []               # start straight away; don't wait for SAST
  variables:
    PARENT_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    strategy: depend      # this job, and the MR, fail if the child pipeline fails

auth:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/api
  trigger:
    include: services/auth/.gitlab-ci.yml
  rules:
    - exists: [services/auth/.gitlab-ci.yml]
      changes: [services/auth/**/*, contracts/api/auth.openapi.yaml, ci/**/*]

catalogue:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/events contracts/grpc contracts/api
  trigger:
    include: services/catalogue/.gitlab-ci.yml
  rules:
    - exists: [services/catalogue/.gitlab-ci.yml]
      changes: [services/catalogue/**/*, contracts/events/**/*, contracts/grpc/**/*, contracts/api/**/*, ci/**/*]

search:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/events
  trigger:
    include: services/search/.gitlab-ci.yml
  rules:
    - exists: [services/search/.gitlab-ci.yml]
      changes: [services/search/**/*, contracts/events/**/*, ci/**/*]

streaming:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/grpc
  trigger:
    include: services/streaming/.gitlab-ci.yml
  rules:
    - exists: [services/streaming/.gitlab-ci.yml]
      changes: [services/streaming/**/*, contracts/grpc/**/*, ci/**/*]

upload:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/events
  trigger:
    include: services/upload/.gitlab-ci.yml
  rules:
    - exists: [services/upload/.gitlab-ci.yml]
      changes: [services/upload/**/*, contracts/events/**/*, ci/**/*]

lyrics:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/events
  trigger:
    include: services/lyrics/.gitlab-ci.yml
  rules:
    - exists: [services/lyrics/.gitlab-ci.yml]
      changes: [services/lyrics/**/*, contracts/events/**/*, ci/**/*]

waveform:
  extends: .service-trigger
  variables:
    CONTRACT_PATHS: contracts/events
  trigger:
    include: services/waveform/.gitlab-ci.yml
  rules:
    - exists: [services/waveform/.gitlab-ci.yml]
      changes: [services/waveform/**/*, contracts/events/**/*, ci/**/*]

playlist:
  extends: .service-trigger
