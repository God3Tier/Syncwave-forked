include:
  - local: ci/service.yml

variables:
  SERVICE: jam
  SERVICE_DIR: services/jam

lint:
  extends: .lint
  image: python:3.12-slim
  script:
    - pip install --quiet -r requirements-dev.txt
    - ruff check src tests
    - ruff format --check src tests

test:
  extends: .test
  image: python:3.12-slim
  variables:
    TEST_REPORTS: report.xml
  script:
    - pip install --quiet -r requirements-dev.txt
    - pytest --junitxml=report.xml

build:
  extends: .build-image

deploy:
  extends: .deploy-ecs
