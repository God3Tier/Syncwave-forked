services:
  # Song request orchestrator: gets a song's audio, lyrics and waveform points
  # from Streaming, Lyrics and Waveform in one call. The root stack supplies
  # Postgres and the services it calls; the gateway routes /api/orchestrator/*.
  orchestrator:
    build: .
    image: ${IMAGE_REGISTRY:-syncwave}/song_request_orchestrator:${IMAGE_TAG:-local}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: orchestrator
      DB_USER: orchestrator
      DB_PASSWORD: orchestrator
      PLAYLIST_SERVICE_URL: http://playlist:8080
      AUDIO_SERVICE_URL: http://streaming:8081
      LYRICS_SERVICE_URL: http://lyrics:8080
      WAVEFORM_SERVICE_URL: http://waveform:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # The tests need no database: `make test` runs them in the builder stage.
  test-orchestrator:
    build:
      context: .
      target: builder
    profiles: ["test"]
    volumes:
      - orchestrator_cargo_target:/app/target
    command: ["cargo", "test", "--locked"]

volumes:
  orchestrator_cargo_target:
