# Child pipeline for this service. The root .gitlab-ci.yml starts it when
# this folder, one of the service's contracts or the shared ci/ changes, and
# passes in CONTRACT_PATHS and PARENT_SOURCE.
#
# Keep the job names lint / test / build / deploy: the shared container
# scan and deploy jobs take the image tag from the job called `build`.

include:
  - local: ci/service.yml
  - local: ci/presets/java-maven.yml

variables:
  SERVICE: template               # = folder name = compose service name = image name
  SERVICE_DIR: services/template

lint:
  extends: .java-lint

test:
  extends: .java-test

build:
  extends: .build-image

deploy:
  extends: .deploy-ecs
  # One image running as several ECS services (e.g. API + worker)? List them:
  # variables:
  #   ECS_SERVICES: "template template-worker"

# Not Java? Use the generic jobs and say what to run. Python example:
# lint:
#   extends: .lint
#   image: python:3.13-slim
#   script:
#     - pip install --quiet ruff
#     - ruff check .
# test:
#   extends: .test
#   image: python:3.13-slim
#   variables:
#     TEST_REPORTS: report.xml
#   script:
#     - pip install --quiet -r requirements.txt pytest
#     - pytest --junitxml=report.xml
