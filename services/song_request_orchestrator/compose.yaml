name: audio-testing-orchestrator

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - orchestrator_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  orchestrator:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ORCHESTRATOR_PORT:-8082}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-orchestrator}:${POSTGRES_PASSWORD:-orchestrator_dev_password}@db:5432/${POSTGRES_DB:-orchestrator}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://host.docker.internal:8080/api/auth/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-syncwave-auth}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-syncwave}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  test-orchestrator:
    build:
      context: .
      target: builder
    profiles: ["test"]
    volumes:
      - orchestrator_cargo_target:/app/target
    command: ["cargo", "test", "--locked"]

volumes:
  orchestrator_db_data:
  orchestrator_cargo_target:
