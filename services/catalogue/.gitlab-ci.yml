# Child pipeline for the Catalogue Service (see ci/service.yml). The root
# .gitlab-ci.yml starts it when this folder, contracts/events, contracts/api,
# contracts/grpc or ci/ changes.

include:
  - local: ci/service.yml

variables:
  SERVICE: catalogue                 # = folder name = compose service name = image name
  SERVICE_DIR: services/catalogue

.python:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key: pip-$SERVICE
    paths:
      - .cache/pip

lint:
  extends: [.lint, .python]
  script:
    - pip install --quiet "$(grep '^ruff==' requirements-dev.txt)"
    - ruff check src tests migrations
    - ruff format --check src tests migrations

# Verifies the checked-in media.proto bindings under src/syncwave/media/v1/.
contracts:
  extends: .lint
  image: python:3.12-slim
  script:
    - pip install --quiet -r requirements-dev.txt
    - >-
      python ../../ci/scripts/check-python-grpc-bindings.py
      --proto-root ../../contracts/grpc
      --output src
      syncwave/media/v1/media.proto

# Includes the contract tests against ../../contracts/events.
test:
  extends: [.test, .python]
  variables:
    TEST_REPORTS: report.xml
  script:
    - pip install --quiet --requirement requirements-dev.txt
    - pytest --junitxml=report.xml

build:
  extends: .build-image

deploy:
  extends: .deploy-ecs
  variables:
    ECS_SERVICES: "catalogue catalogue-worker"
