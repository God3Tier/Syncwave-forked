include:
  - local: ci/service.yml

variables:
  SERVICE: jam
  SERVICE_DIR: services/jam

lint:
  extends: .lint
  image: python:3.12-slim
  script:
    - pip install --quiet -r requirements-dev.txt
    - ruff check src tests
    - ruff format --check src tests

contracts:
  extends: .lint
  image: python:3.12-slim
  script:
    - pip install --quiet -r requirements-dev.txt
    - >-
      python ../../ci/scripts/check-python-grpc-bindings.py
      --proto-root ../../contracts/grpc
      --output src
      syncwave/sync/v1/sync.proto

test:
  extends: .test
  image: python:3.12-slim
  variables:
    TEST_REPORTS: report.xml
  script:
    - pip install --quiet -r requirements-dev.txt
    - pytest --junitxml=report.xml

build:
  extends: .build-image

deploy:
  extends: .deploy-ecs
