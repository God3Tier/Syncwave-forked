name: audio-testing-audio-sampler

services:
  audio_transmitter:
    build: .
    ports:
      - "8081:8081"
    # Song metadata comes from the Catalogue Service (no database of its own).
    # By default it is reached through the main stack's gateway on the host, so
    # start the root `docker compose up` first. Point CATALOGUE_URL elsewhere to
    # use a different Catalogue.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CATALOGUE_URL: ${CATALOGUE_URL:-http://host.docker.internal:8080/api/catalogue}
      CATALOGUE_TIMEOUT_SECONDS: ${CATALOGUE_TIMEOUT_SECONDS:-3}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/cache"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # The tests need no database or running Catalogue: both are faked in the tests.
  test-audio:
    build:
      context: .
      target: builder
    profiles: ["test"]
    volumes:
      - audio_cargo_target:/app/target
    command: ["cargo", "test", "--locked"]

volumes:
  audio_cargo_target:
