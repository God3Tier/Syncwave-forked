# Child pipeline for the Search Service (see ci/service.yml). The root
# .gitlab-ci.yml starts it when this folder or contracts/events changes.

include:
  - local: ci/service.yml

variables:
  SERVICE: search
  SERVICE_DIR: services/search

.python:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key: pip-$SERVICE
    paths:
      - .cache/pip

lint:
  extends: [.lint, .python]
  script:
    - pip install --quiet "$(grep '^ruff==' requirements-dev.txt)"
    - ruff check src tests migrations
    - ruff format --check src tests migrations

test:
  extends: [.test, .python]
  variables:
    TEST_REPORTS: report.xml
  script:
    - pip install --quiet --requirement requirements-dev.txt
    - pytest --junitxml=report.xml

build:
  extends: .build-image

deploy:
  extends: .deploy-ecs
  variables:
    ECS_SERVICES: "search search-worker"